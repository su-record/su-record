<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Su — AI-first developer</title>
  <desc id="desc">Build fast. Prove it works. Developer tools, agent workflows, and frontend craft.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117" />
      <stop offset="0.55" stop-color="#111827" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.55" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)" />
  <circle cx="1000" cy="30" r="230" fill="url(#glow)" />
  <circle cx="1055" cy="176" r="92" fill="none" stroke="#60A5FA" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="1055" cy="176" r="56" fill="none" stroke="#A78BFA" stroke-opacity="0.32" stroke-width="2" />
  <circle cx="1055" cy="176" r="10" fill="#67E8F9" filter="url(#soft-glow)" />
  <path d="M892 82C970 46 1082 50 1158 112" fill="none" stroke="url(#accent)" stroke-opacity="0.68" stroke-width="3" stroke-linecap="round" />
  <path d="M888 262C972 288 1091 274 1164 213" fill="none" stroke="url(#accent)" stroke-opacity="0.36" stroke-width="2" stroke-linecap="round" />

  <rect x="70" y="54" width="60" height="6" rx="3" fill="url(#accent)" />
  <text x="70" y="132" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="750" letter-spacing="-2">SU</text>
  <text x="70" y="184" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600">Build fast. Prove it works.</text>
  <text x="70" y="228" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Developer tools · Agent workflows · Frontend craft</text>

  <g transform="translate(70 259)">
    <circle cx="7" cy="7" r="7" fill="#22C55E" />
    <text x="25" y="14" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Seoul, Korea</text>
  </g>
</svg>
