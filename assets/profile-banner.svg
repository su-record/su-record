<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Su — AI-first developer</title>
  <desc id="desc">Build fast. Prove it works. Developer tools, agent workflows, and frontend craft.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090F" />
      <stop offset="0.55" stop-color="#0D1424" />
      <stop offset="1" stop-color="#14204A" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.55" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="glow-violet">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.28" />
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" />
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="28" />
    </clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .flow { stroke-dasharray: 6 14; animation: flow 5s linear infinite; }
    .flow-slow { stroke-dasharray: 4 16; animation: flow 9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -200; } }
    .spin { animation: spin 36s linear infinite; transform-origin: 1040px 160px; }
    .orbit { animation: spin 14s linear infinite; transform-origin: 1040px 160px; }
    .orbit-rev { animation: spin 22s linear infinite reverse; transform-origin: 1040px 160px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse-ring { animation: pulse-ring 2.8s ease-out infinite; transform-origin: 1040px 160px; }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .tw { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .flow-slow, .spin, .orbit, .orbit-rev, .pulse-ring, .cursor, .tw { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <circle cx="980" cy="20" r="270" fill="url(#glow-violet)" />
    <circle cx="1190" cy="300" r="240" fill="url(#glow-cyan)" />

    <!-- flowing circuit lines -->
    <path d="M880 70C960 28 1092 34 1172 98" fill="none" stroke="url(#accent)" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" class="flow" />
    <path d="M876 256C968 292 1098 280 1178 208" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" class="flow-slow" />

    <!-- orbit system -->
    <circle cx="1040" cy="160" r="96" fill="none" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="1.5" />
    <circle cx="1040" cy="160" r="70" fill="none" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 9" class="spin" />
    <circle cx="1040" cy="160" r="44" fill="none" stroke="#67E8F9" stroke-opacity="0.22" stroke-width="1.5" />
    <g class="orbit">
      <circle cx="1136" cy="160" r="5" fill="#22D3EE" />
      <circle cx="1136" cy="160" r="9" fill="#22D3EE" opacity="0.35" filter="url(#soft-glow)" />
    </g>
    <g class="orbit-rev">
      <circle cx="996" cy="160" r="4" fill="#A78BFA" />
    </g>
    <circle cx="1040" cy="160" r="12" fill="none" stroke="#67E8F9" stroke-width="2" class="pulse-ring" />
    <circle cx="1040" cy="160" r="11" fill="#67E8F9" filter="url(#soft-glow)" />
    <circle cx="1040" cy="160" r="7" fill="#E0F2FE" />

    <!-- twinkling stars -->
    <circle cx="760" cy="52" r="2" fill="#E2E8F0" class="tw" />
    <circle cx="830" cy="150" r="1.5" fill="#A5B4FC" class="tw" style="animation-delay:-1.2s" />
    <circle cx="920" cy="230" r="2" fill="#67E8F9" class="tw" style="animation-delay:-2.4s" />
    <circle cx="1150" cy="60" r="1.5" fill="#E2E8F0" class="tw" style="animation-delay:-0.6s" />
    <circle cx="1105" cy="268" r="2" fill="#A5B4FC" class="tw" style="animation-delay:-1.8s" />
    <circle cx="700" cy="110" r="1.5" fill="#67E8F9" class="tw" style="animation-delay:-3s" />

    <!-- left column -->
    <rect x="70" y="46" width="60" height="6" rx="3" fill="url(#accent)" />
    <text x="70" y="120" fill="url(#accent)" font-size="62" font-weight="800" letter-spacing="-2">SU</text>
    <text x="70" y="168" fill="#F8FAFC" font-size="27" font-weight="650">Build fast. Prove it works.</text>
    <text x="70" y="202" fill="#8B98AE" font-size="18">Developer tools · Agent workflows · Frontend craft</text>

    <!-- terminal line -->
    <rect x="70" y="228" width="520" height="42" rx="10" fill="#0A101E" stroke="#1E293B" stroke-width="1.5" />
    <text x="88" y="254" class="mono" font-size="15.5">
      <tspan fill="#34D399">~$</tspan><tspan fill="#E2E8F0" xml:space="preserve"> vibe verify  </tspan><tspan fill="#4ADE80">✓ passed</tspan><tspan fill="#64748B" xml:space="preserve"> · evidence &gt; self-report</tspan>
    </text>
    <rect x="560" y="240" width="9" height="18" rx="1.5" fill="#22D3EE" class="cursor" />

    <!-- location chip -->
    <g transform="translate(622 242)">
      <circle cx="6" cy="7" r="5.5" fill="#22C55E" />
      <circle cx="6" cy="7" r="5.5" fill="#22C55E" opacity="0.4" filter="url(#soft-glow)" />
      <text x="20" y="12" fill="#CBD5E1" font-size="14">Seoul, Korea</text>
    </g>
  </g>
</svg>
